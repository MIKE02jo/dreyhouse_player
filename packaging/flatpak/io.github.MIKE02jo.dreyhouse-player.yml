# Flathub submission manifest for DREYHOUSE PLAYER (Tauri desktop build).
id: io.github.MIKE02jo.dreyhouse-player
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: dreyhouse-player
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Downloads default here; picking another folder routes through the portal instead.
  - --filesystem=xdg-download
  # Discord Rich Presence talks to the client over this socket; no portal covers it.
  - --filesystem=xdg-run/discord-ipc-0
  # Tray icon registration (libayatana-appindicator); no portal covers this.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications; notify-rust calls this name directly, not the portal.
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: dreyhouse-player
    buildsystem: simple
    build-commands:
      - ar -x *.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/dreyhouse-player $FLATPAK_DEST/bin/dreyhouse-player
      - install -Dm755 usr/bin/infinitv-ffmpeg $FLATPAK_DEST/bin/infinitv-ffmpeg
      - install -Dm644 "usr/share/icons/hicolor/32x32/apps/dreyhouse-player.png" $FLATPAK_DEST/share/icons/hicolor/32x32/apps/$FLATPAK_ID.png
      - install -Dm644 "usr/share/icons/hicolor/128x128/apps/dreyhouse-player.png" $FLATPAK_DEST/share/icons/hicolor/128x128/apps/$FLATPAK_ID.png
      - install -Dm644 "usr/share/icons/hicolor/256x256@2/apps/dreyhouse-player.png" "$FLATPAK_DEST/share/icons/hicolor/256x256@2/apps/$FLATPAK_ID.png"
      - install -Dm644 "usr/share/applications/DREYHOUSE PLAYER.desktop" $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - sed -i "s/^Icon=.*/Icon=$FLATPAK_ID/" $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 $FLATPAK_ID.metainfo.xml $FLATPAK_DEST/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -Dm644 LICENSE $FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE
    sources:
      # TODO before first Flathub submission: this project has not published
      # a .deb release yet. Once `pnpm run make:app` / release.yml produces
      # one under github.com/MIKE02jo/dreyhouse_player/releases, replace the
      # url/sha256 below with that release's actual .deb asset (the
      # x-checker-data block will then keep it current automatically).
      - type: file
        url: https://github.com/MIKE02jo/dreyhouse_player/releases/download/v1.0.0/DREYHOUSE.PLAYER_1.0.0_amd64.deb
        sha256: "REPLACE_ME_WITH_REAL_SHA256_ONCE_A_RELEASE_EXISTS"
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/MIKE02jo/dreyhouse_player/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("_amd64\\.deb$")) | .browser_download_url
          is-main-source: true
      - type: file
        url: https://raw.githubusercontent.com/MIKE02jo/dreyhouse_player/main/LICENSE
        sha256: 3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986
        dest-filename: LICENSE
      - type: file
        path: io.github.MIKE02jo.dreyhouse-player.metainfo.xml
